services:
  db:
    container_name: db
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=database37
      - POSTGRES_USER=user37
    image: postgres:latest
    networks:
      - app_network

  app:
    container_name: app
    image: poviraevsergei/app37:version2
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
